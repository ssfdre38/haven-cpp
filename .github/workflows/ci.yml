name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux-gcc:
    name: Linux (GCC 13 + Ninja)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build core binaries and test suites
        run: |
          cmake --build build --target \
            haven-cli \
            haven-server \
            haven-bake \
            test-turbo-bake \
            test-security-fuzz \
            test-secure-cluster \
            test-multi-model-arch \
            test-model-intelligence \
            test-lean-session \
            haven-modules \
            test-tpu-scheduler \
            test-tpu-gemma4-onchip \
            -j$(nproc)

      - name: Run zero-GGUF security, architecture, intelligence, lean session, scheduler & TPU StableHLO tests
        run: |
          ./build/test-turbo-bake
          ./build/test-security-fuzz
          ./build/test-secure-cluster
          ./build/test-multi-model-arch
          ./build/test-model-intelligence
          ./build/test-lean-session
          ./build/test-tpu-scheduler
          ./build/test-tpu-gemma4-onchip --emit-only-synthetic

      - name: Verify ultra-lean desktop/edge build (-DHAVEN_ENABLE_TPU=OFF)
        run: |
          cmake -B build-lean -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAVEN_ENABLE_TPU=OFF
          cmake --build build-lean --target haven-cli haven-server haven-bake haven-modules test-model-intelligence test-lean-session -j$(nproc)
          ./build-lean/test-model-intelligence
          ./build-lean/test-lean-session

  windows-msvc:
    name: Windows (MSVC + Ninja)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build core binaries and test suites
        run: |
          cmake --build build --target `
            haven-cli `
            haven-server `
            haven-bake `
            test-turbo-bake `
            test-security-fuzz `
            test-secure-cluster `
            test-multi-model-arch `
            test-model-intelligence `
            test-lean-session `
            haven-modules `
            test-tpu-scheduler `
            test-tpu-gemma4-onchip `
            plugin_terminal `
            plugin_workspace_coder `
            plugin_vault_sync `
            plugin_browser

      - name: Run zero-GGUF security, architecture, intelligence, lean session, scheduler & TPU StableHLO tests
        run: |
          .\build\test-turbo-bake.exe
          .\build\test-security-fuzz.exe
          .\build\test-secure-cluster.exe
          .\build\test-multi-model-arch.exe
          .\build\test-model-intelligence.exe
          .\build\test-lean-session.exe
          .\build\test-tpu-scheduler.exe
          .\build\test-tpu-gemma4-onchip.exe --emit-only-synthetic
